<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <meta name="description" content="Quick-reference recipe cards from Instagram reels.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Recipes</title>
</head>
<body>
  <div id="app"></div>
  <div id="timers" class="timers" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    // Safety net: if the app fails to start, offer a clean reload instead of a blank screen.
    (function () {
      function rescue() {
        if (document.getElementById("app").childElementCount || document.getElementById("rescue")) return;
        var el = document.createElement("div");
        el.id = "rescue";
        el.innerHTML = '<p>The app didn’t load.</p><button type="button">Reload</button>';
        el.querySelector("button").onclick = function () {
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          Promise.all(jobs).finally(function () { location.reload(); });
        };
        document.body.appendChild(el);
      }
      window.addEventListener("error", function () { setTimeout(rescue, 300); }, true);
      window.addEventListener("load", function () { setTimeout(rescue, 2500); });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
